    <main>

        <h2>Formulario de contacto</h2>

        <section class="contacto">

            <form>

                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" placeholder="Escribe tu nombre">

                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" placeholder="Escribe tu correo">

                <label>¿En qué película o serie conociste a Zendaya?</label>

                <input type="radio" name="pelicula" id="spiderman">
                <label for="spiderman">Spider-Man</label>

                <input type="radio" name="pelicula" id="euphoria">
                <label for="euphoria">Euphoria</label>

                <input type="radio" name="pelicula" id="dune">
                <label for="dune">Dune</label>

                <label for="comentario">Déjanos un comentario</label>
                <textarea id="comentario" rows="5" placeholder="Escribe aquí..."></textarea>

                <input type="submit" value="Enviar">

            </form>

        </section>

    </main>
    <footer>
        <h2>Redes sociales</h2>
